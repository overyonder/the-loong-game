[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bceval"
version = "0.1.0"
description = "A learned position evaluation (win probability per round) for UNSW Battlecode replays"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pycapnp>=2.0"]

[tool.setuptools]
packages = ["bceval"]

[tool.setuptools.package-data]
bceval = ["model.json", "replay.capnp"]
