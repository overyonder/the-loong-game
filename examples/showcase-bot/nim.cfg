# Emit C for the judge's wasm32 clang instead of building a native program.
compileOnly
nimcache = "gen"
cpu = wasm32
os = any
mm = arc
threads = off
noMain      # controller.nim exports the main wasi-libc can start
exceptions = goto
panics = on
define = useMalloc
define = danger
define = noSignalHandler
hints = off
define = loongDiagnostics  # compiled in; runs only when the recovery marks the bot (runtime/gizmos.h)
