<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four workflows through the same judge host</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="520" height="640" fill="#ede5d5"/>
<rect x="20" y="20" width="480" height="70" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="23" fill="#ede5d5" text-anchor="start" font-weight="bold">One judge host</text>
<rect x="58" y="120" width="442" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="72" y="145" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Ordinary game</text><text x="72" y="180" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Official engine; metered bot instances</text><text x="72" y="206" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">100M points per dragon turn</text>
<path d="M38 90 L38 174 L56 174" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="58" y="248" width="442" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="72" y="273" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Inspection</text><text x="72" y="308" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Recorded observations into a bot</text><text x="72" y="334" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Actions, annotations and memory</text>
<path d="M38 90 L38 302 L56 302" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="58" y="376" width="442" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="72" y="401" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Served team</text><text x="72" y="436" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Local socket to an external process</text><text x="72" y="462" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Its work is not metered</text>
<path d="M38 90 L38 430 L56 430" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="58" y="504" width="442" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="72" y="529" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Lockstep</text><text x="72" y="564" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Official engine and CPU reference</text><text x="72" y="590" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Same replies; first differing input</text>
<path d="M38 90 L38 558 L56 558" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
