<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 494" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The local workstation, private object store, Vast.ai rental and their orchestration</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1100" height="494" fill="#ede5d5"/>
<text x="20" y="30" font-size="17" fill="#20251f" text-anchor="start" font-weight="bold">Where a training run lived</text>
<rect x="20" y="50" width="300" height="144" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="75" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Local workstation</text><text x="34" y="96" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">AM4 · Ryzen 7 5800X3D</text><text x="34" y="114" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">32 GB DDR4 · RTX 5070 Ti 16 GB</text><text x="34" y="132" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">builds bundles and checks exports</text><text x="34" y="150" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">keeps the durable copy of every run</text>
<rect x="400" y="50" width="280" height="144" rx="8" fill="#f6f1e7" stroke="#a8801a" stroke-width="1.6"/><text x="414" y="75" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Private S3 object store</text><text x="414" y="96" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">large input and result archives</text><text x="414" y="114" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">short-lived signed transfers</text><text x="414" y="132" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">no cloud key on the rental</text><text x="414" y="150" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">no public objects</text>
<rect x="760" y="50" width="320" height="144" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="774" y="75" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Vast.ai rental</text><text x="774" y="96" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">2 × Xeon Gold 6448Y</text><text x="774" y="114" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">64 cores / 128 threads · 1 TB RAM</text><text x="774" y="132" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">4 × H100</text><text x="774" y="150" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">3 cards teach · 1 card distils</text>
<path d="M320 98 L398 98" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M680 98 L758 98" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="360" y="86" font-size="11.5" fill="#66675e" text-anchor="middle" font-weight="normal">archives</text>
<text x="720" y="86" font-size="11.5" fill="#66675e" text-anchor="middle" font-weight="normal">signed fetch</text>
<path d="M320 166 L365 166 L365 220 L715 220 L715 166 L758 166" fill="none" stroke="#66675e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="540" y="214" font-size="11.5" fill="#b53b13" text-anchor="middle" font-weight="normal">rental connector: commands, tar streams, checkpoints and logs</text>
<text x="20" y="264" font-size="17" fill="#20251f" text-anchor="start" font-weight="bold">What the scripts did</text>
<rect x="20" y="284" width="194" height="105" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="309" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">1. Pack</text><text x="34" y="330" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">source, judge, maps</text><text x="34" y="348" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and demonstrations</text>
<rect x="236" y="284" width="194" height="105" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="250" y="309" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">2. Connect</text><text x="250" y="330" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">copy the bundle</text><text x="250" y="348" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">start pinned jobs</text>
<path d="M216 336 L234 336" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="452" y="284" width="194" height="105" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="466" y="309" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">3. Run</text><text x="466" y="330" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">teacher + student</text><text x="466" y="348" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">CPU demo workers</text>
<path d="M432 336 L450 336" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="668" y="284" width="194" height="105" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="682" y="309" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">4. Save</text><text x="682" y="330" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">atomic latest.pt</text><text x="682" y="348" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">immutable snapshots</text>
<path d="M648 336 L666 336" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="884" y="284" width="194" height="105" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="898" y="309" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">5. Recover</text><text x="898" y="330" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">pull every 15 min</text><text x="898" y="348" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and before shutdown</text>
<path d="M864 336 L882 336" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="20" y="426" font-size="14" fill="#20251f" text-anchor="start" font-weight="bold">The rental is disposable. The checkpoints are not.</text>
<text x="20" y="450" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">The connector carries control traffic; S3 carries bulky fleet archives through expiring links.</text>
<text x="20" y="471" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">Personal details, addresses, credentials and instance identifiers are intentionally absent.</text>
</svg>
