<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 150" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Why a bot tuned to today&#x27;s ladder doesn&#x27;t last</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="150" fill="#ede5d5"/>
<rect x="20" y="20" width="235" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Opponents change</text><text x="34" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">teams upload new bots</text><text x="34" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">twelve times an hour</text>
<rect x="270" y="20" width="235" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="284" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Maps change</text><text x="284" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">every tournament map</text><text x="284" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">is unseen</text>
<rect x="520" y="20" width="235" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="534" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Rules change</text><text x="534" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">random pearl seeding broke</text><text x="534" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">20 teams&#x27; hardcoded</text><text x="534" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">schedules overnight</text>
<rect x="770" y="20" width="220" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="784" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Views are partial</text><text x="784" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">a 7×7 window, and</text><text x="784" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">sonar for the rest</text>
</svg>
