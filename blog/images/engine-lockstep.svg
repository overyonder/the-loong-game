<rect width="760" height="635" fill="#ede5d5"/>
<text x="380" y="40" font-size="24" fill="#20251f" text-anchor="middle" font-weight="bold">Same map and seed</text>
<path d="M380 56 L380 80 L185 80 L185 117" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M380 56 L380 80 L575 80 L575 117" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
