<rect x="425" y="120" width="300" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="439" y="145" font-size="24" fill="#20251f" text-anchor="start" font-weight="bold">CPU port</text><text x="439" y="180" font-size="20" fill="#66675e" text-anchor="start" font-weight="normal">Fixed-array simulation</text>
<path d="M185 230 L185 342 L212 342" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M575 230 L575 342 L548 342" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
