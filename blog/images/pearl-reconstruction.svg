<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 246" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Rebuilding hidden pearl countdowns from a replay and its seed</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1040" height="246" fill="#ede5d5"/>
<rect x="20" y="36" width="220" height="120" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="61" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Site replay</text><text x="34" y="82" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">map name</text><text x="34" y="100" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">match seed</text><text x="34" y="118" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">pearl gaps are zero</text>
<rect x="280" y="36" width="220" height="120" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="294" y="61" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Engine draws</text><text x="294" y="82" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">one seeded random stream</text><text x="294" y="100" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">every attempt consumes a draw</text><text x="294" y="118" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">occupied cells still count</text>
<rect x="540" y="36" width="220" height="120" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="554" y="61" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Fitted gap table</text><text x="554" y="82" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">first spawns constrain gaps</text><text x="554" y="100" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">later spawns reject choices</text><text x="554" y="118" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">one table explains the game</text>
<rect x="800" y="36" width="220" height="120" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="814" y="61" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Regenerated game</text><text x="814" y="82" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">same spawn attempts</text><text x="814" y="100" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">same actions and points</text><text x="814" y="118" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">same final state</text>
<path d="M240 96 L278 96" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M500 96 L538 96" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M760 96 L798 96" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="20" y="202" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">The replay tells us when pearls appeared. The engine source tells us which random draw made each attempt.</text>
<text x="20" y="224" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">Together they recover the hidden table without using it to choose how the bot plays.</text>
</svg>
