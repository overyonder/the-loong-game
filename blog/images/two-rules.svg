<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 150" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Two rules that pull dragons in opposite directions</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="150" fill="#ede5d5"/>
<rect x="20" y="20" width="470" height="110" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Round 500</text><text x="34" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">If neither team is wiped out, the longest living</text><text x="34" y="84" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">dragon wins. So our longest dragon should grow</text><text x="34" y="102" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">and stay out of trouble.</text>
<rect x="530" y="20" width="460" height="110" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="544" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">A head-on collision</text><text x="544" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">When two heads meet, both dragons die, however</text><text x="544" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">long each was. A two-segment dragon has almost</text><text x="544" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">nothing to lose.</text>
</svg>
