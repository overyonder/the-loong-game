<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 226" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Who hears a sonar message</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="990" height="226" fill="#ede5d5"/>
<text x="20" y="30" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">A ray stops at the first body it meets, and the message carries no sender</text>
<rect x="20" y="50" width="440" height="132" fill="#1d3027" rx="4"/>
<path d="M64 50v132M108 50v132M152 50v132M196 50v132M240 50v132M284 50v132M328 50v132M372 50v132M416 50v132M20 94h440M20 138h440" stroke="rgba(243,236,223,.07)"/>
<circle cx="86.0" cy="116.0" r="15.84" fill="#ff7a3d"/>
<text x="86.0" y="157.8" font-size="11.5" fill="#f3ecdf" text-anchor="middle" font-weight="normal">sender</text>
<circle cx="262.0" cy="116.0" r="15.84" fill="#f3ecdf"/>
<text x="262.0" y="157.8" font-size="11.5" fill="#f3ecdf" text-anchor="middle" font-weight="normal">enemy hears it</text>
<circle cx="394.0" cy="116.0" r="15.84" fill="#e0a36a"/>
<text x="394.0" y="157.8" font-size="11.5" fill="#f3ecdf" text-anchor="middle" font-weight="normal">teammate</text>
<path d="M86.0 116.0L240.0 116.0" stroke="#b53b13" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#s)"/>
<rect x="520" y="50" width="440" height="132" fill="#1d3027" rx="4"/>
<path d="M564 50v132M608 50v132M652 50v132M696 50v132M740 50v132M784 50v132M828 50v132M872 50v132M916 50v132M520 94h440M520 138h440" stroke="rgba(243,236,223,.07)"/>
<circle cx="586.0" cy="116.0" r="15.84" fill="#f3ecdf"/>
<text x="586.0" y="157.8" font-size="11.5" fill="#f3ecdf" text-anchor="middle" font-weight="normal">enemy, sending LO…</text>
<circle cx="806.0" cy="116.0" r="15.84" fill="#e0a36a"/>
<text x="806.0" y="157.8" font-size="11.5" fill="#f3ecdf" text-anchor="middle" font-weight="normal">our dragon</text>
<path d="M586.0 116.0L784.0 116.0" stroke="#b53b13" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#s)"/>
<text x="20" y="208" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">Decoding: an enemy in the way reads what we send.</text>
<text x="520" y="208" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">Misinformation: nothing stops a message in our format.</text>
</svg>
