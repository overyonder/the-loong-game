<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How a champion makes a kamikaze</title>
<desc id="d">First, a champion of length 10. Second, it splits off its last three segments, which become a new dragon facing the other way and running a fresh copy of the program. Third, on its first turn the child hears the champion announce length 10 by sonar, so it knows a longer teammate exists and takes the kamikaze role.</desc>
