<text x="111.0" y="26" font-size="14" font-weight="bold" fill="#20251f" text-anchor="middle">Champion, length 10</text>
<polyline points="189.0,79.0 163.0,79.0 137.0,79.0 111.0,79.0 85.0,79.0 59.0,79.0 33.0,79.0 33.0,105.0 33.0,131.0 59.0,131.0" fill="none" stroke="#ff7a3d" stroke-width="13.0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="189.0" cy="79.0" r="9.36" fill="#ff7a3d"/>
