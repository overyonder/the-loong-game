<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">How the harness sorts a finished game</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1000" height="150" fill="#ede5d5"/>
<rect x="20" y="20" width="380" height="110" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Counted</text><text x="34" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">a win, a loss or a draw,</text><text x="34" y="84" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">read from the engine&#x27;s result line</text>
<rect x="440" y="20" width="540" height="110" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="454" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Errors, in their own column</text><text x="454" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">Match exceeded the harness timeout</text><text x="454" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">Battlecode exited with code N</text><text x="454" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">Bot execution failure: out of time, exited, a limit, no valid action</text><text x="454" y="120" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">No engine result found  ·  Replay was not written</text>
</svg>
