<text x="400.0" y="34" font-size="15" fill="#20251f" text-anchor="middle" font-weight="bold">Where our time goes</text>
<text x="400.0" y="58" font-size="12" fill="#66675e" text-anchor="middle" font-weight="normal">grand strategy and</text>
<text x="400.0" y="74" font-size="12" fill="#66675e" text-anchor="middle" font-weight="normal">tactical ideas</text>
