<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title description" font-family="Helvetica, Arial, sans-serif">
  <title id="title">UNSW Battlecode 2026 timeline</title>
  <desc id="description">The seed ladder runs from 21 September to 17 October 2026. The Sprint is on 1 October, the Qualifiers on 10 October, final submissions close on 16 October and the Grand Final is on 17 October at UNSW Sydney.</desc>
  <rect x="40" y="112" width="640" height="16" rx="8" fill="#dcd0bb"/>
  <text x="58" y="124" font-size="11" fill="#66675e">Seed ladder: ranked games all season</text>
  <g fill="#b53b13" stroke="#ede5d5" stroke-width="3">
    <circle cx="40" cy="120" r="8"/>
    <circle cx="286" cy="120" r="8"/>
    <circle cx="508" cy="120" r="8"/>
    <circle cx="655" cy="120" r="8"/>
    <circle cx="680" cy="120" r="8"/>
  </g>
  <g stroke="#b9ad99" stroke-width="1">
    <line x1="40" y1="130" x2="40" y2="150"/>
    <line x1="286" y1="110" x2="286" y2="90"/>
    <line x1="508" y1="130" x2="508" y2="150"/>
    <line x1="655" y1="110" x2="655" y2="90"/>
    <line x1="680" y1="130" x2="680" y2="150"/>
  </g>
  <g fill="#20251f">
    <text x="40" y="170" font-size="12" font-weight="700" fill="#b53b13">21 SEP</text>
    <text x="40" y="190" font-size="15">Season opens</text>
    <text x="286" y="34" font-size="12" font-weight="700" fill="#b53b13" text-anchor="middle">1 OCT</text>
    <text x="286" y="54" font-size="15" text-anchor="middle">Sprint</text>
    <text x="286" y="74" font-size="12" fill="#66675e" text-anchor="middle">online · every team</text>
    <text x="508" y="170" font-size="12" font-weight="700" fill="#b53b13" text-anchor="middle">10 OCT</text>
    <text x="508" y="190" font-size="15" text-anchor="middle">Qualifiers</text>
    <text x="508" y="210" font-size="12" fill="#66675e" text-anchor="middle">eligible teams</text>
    <text x="662" y="34" font-size="12" font-weight="700" fill="#b53b13" text-anchor="end">16 OCT</text>
    <text x="662" y="54" font-size="15" text-anchor="end">Final submissions</text>
    <text x="680" y="170" font-size="12" font-weight="700" fill="#b53b13" text-anchor="end">17 OCT</text>
    <text x="680" y="190" font-size="15" text-anchor="end">Grand Final</text>
    <text x="680" y="210" font-size="12" fill="#66675e" text-anchor="end">UNSW Sydney</text>
  </g>
</svg>
