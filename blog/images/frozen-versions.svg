<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 386" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">How bot versions and library pieces become immutable</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1020" height="386" fill="#ede5d5"/>
<text x="20" y="30" font-size="17" fill="#20251f" text-anchor="start" font-weight="bold">A version becomes evidence once it plays</text>
<rect x="20" y="52" width="220" height="112" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="77" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">In development</text><text x="34" y="98" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">the highest number</text><text x="34" y="116" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">changes as we work</text>
<rect x="270" y="52" width="220" height="112" rx="8" fill="#263d31" stroke="#b53b13" stroke-width="1.6"/><text x="284" y="77" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Freeze</text><text x="284" y="98" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">make the source immutable</text><text x="284" y="116" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">keep its identifier</text>
<path d="M242 108 L268 108" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="520" y="52" width="220" height="112" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="534" y="77" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Build</text><text x="534" y="98" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">pin every library piece</text><text x="534" y="116" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">register the WebAssembly</text>
<path d="M492 108 L518 108" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="770" y="52" width="220" height="112" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="784" y="77" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Keep</text><text x="784" y="98" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">replay provenance</text><text x="784" y="116" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">opponent and regression test</text>
<path d="M742 108 L768 108" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="20" y="205" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">A frozen version never changes. New work gets the next number, so an old result can always be rebuilt.</text>
<text x="20" y="250" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">One library piece can advance without moving the others</text>
<rect x="20" y="270" width="220" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="295" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">0001 · pseudocode</text><text x="34" y="316" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">the algorithm and contract</text>
<path d="M240 316 L278 316" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="280" y="270" width="220" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="294" y="295" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">0002.nim</text><text x="294" y="316" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">the clear implementation</text>
<path d="M500 316 L538 316" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="540" y="270" width="220" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="554" y="295" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">0003.rk</text><text x="554" y="316" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">the measured hot kernel</text>
<text x="790" y="300" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">library.toml pins the</text>
<text x="790" y="320" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">versions one bot uses</text>
</svg>
