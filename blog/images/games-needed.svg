<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Games needed to detect a better bot</title>
<desc id="d">Games needed for a one-sided test at 95% confidence and 80% power, by the better bot's true win rate: about 3,900 games at 52%, 620 at 55%, 150 at 60%, 37 at 70% and 23 at 75%. A hand-rolled loop of 22 games only detects bots that win about 75% or more.</desc>
