<line x1="70" x2="690" y1="320.0" y2="320.0" stroke="#d9d0bf"/>
<text x="60" y="324.0" font-size="12" fill="#66675e" text-anchor="end">10</text>
<line x1="70" x2="690" y1="223.33333333333331" y2="223.33333333333331" stroke="#d9d0bf"/>
<text x="60" y="227.33333333333331" font-size="12" fill="#66675e" text-anchor="end">100</text>
<line x1="70" x2="690" y1="126.66666666666666" y2="126.66666666666666" stroke="#d9d0bf"/>
<text x="60" y="130.66666666666666" font-size="12" fill="#66675e" text-anchor="end">1,000</text>
<line x1="70" x2="690" y1="30.0" y2="30.0" stroke="#d9d0bf"/>
<text x="60" y="34.0" font-size="12" fill="#66675e" text-anchor="end">10,000</text>
<text x="136.4285714285715" y="342" font-size="12" fill="#66675e" text-anchor="middle">55%</text>
<text x="247.14285714285703" y="342" font-size="12" fill="#66675e" text-anchor="middle">60%</text>
<text x="357.85714285714283" y="342" font-size="12" fill="#66675e" text-anchor="middle">65%</text>
<text x="468.5714285714284" y="342" font-size="12" fill="#66675e" text-anchor="middle">70%</text>
<text x="579.2857142857142" y="342" font-size="12" fill="#66675e" text-anchor="middle">75%</text>
<text x="690.0" y="342" font-size="12" fill="#66675e" text-anchor="middle">80%</text>
<text x="380.0" y="368" font-size="13" fill="#20251f" text-anchor="middle">True win rate of the better bot</text>
<text x="18" y="175.0" font-size="13" fill="#20251f" text-anchor="middle" transform="rotate(-90 18 175.0)">Games needed (log scale)</text>
