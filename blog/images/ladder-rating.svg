<rect x="40" y="454" width="355" height="86" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><circle cx="62" cy="477" r="11" fill="#263d31"/><text x="62" y="481" font-size="12" font-weight="bold" fill="#ede5d5" text-anchor="middle">1</text><text x="82" y="482" font-size="14.5" font-weight="bold" fill="#20251f" text-anchor="start">Basic flood fill</text><text x="54" y="505" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">Our first bot held between 1500 and 1550.</text>
<rect x="425" y="454" width="355" height="86" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><circle cx="447" cy="477" r="11" fill="#263d31"/><text x="447" y="481" font-size="12" font-weight="bold" fill="#ede5d5" text-anchor="middle">2</text><text x="467" y="482" font-size="14.5" font-weight="bold" fill="#20251f" text-anchor="start">Basic planning agent</text><text x="439" y="505" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">It jumped to about 1625, then drifted back</text><text x="439" y="522" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">towards 1550 as the rest of the field improved.</text>
<rect x="40" y="558" width="740" height="102" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><circle cx="62" cy="581" r="11" fill="#b53b13"/><text x="62" y="585" font-size="12" font-weight="bold" fill="#ede5d5" text-anchor="middle">3</text><text x="82" y="586" font-size="14.5" font-weight="bold" fill="#20251f" text-anchor="start">More complex planning agent</text><text x="54" y="609" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">Its first live result took us down to 1492. Replay review, revised logic and</text><text x="54" y="626" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">hand-crafted human ideas improved the design and heuristics to 1830: rank 40.</text>
<rect x="40" y="678" width="355" height="104" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><circle cx="62" cy="701" r="11" fill="#66675e"/><text x="62" y="705" font-size="12" font-weight="bold" fill="#ede5d5" text-anchor="middle">4</text><text x="82" y="706" font-size="14.5" font-weight="bold" fill="#20251f" text-anchor="start">RL bot: proposed trial</text><text x="54" y="729" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">The 1750 dip is the planned first live test,</text><text x="54" y="746" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">not a recorded point. Sprint: 54th seed,</text><text x="54" y="763" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">eliminated in the round of 64.</text>
<rect x="425" y="678" width="355" height="104" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><circle cx="447" cy="701" r="11" fill="#b53b13"/><text x="447" y="705" font-size="12" font-weight="bold" fill="#ede5d5" text-anchor="middle">?</text><text x="467" y="706" font-size="14.5" font-weight="bold" fill="#20251f" text-anchor="start">Final over|yonder</text><text x="439" y="729" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">Our holdout combines classical AI and planning</text><text x="439" y="746" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">with machine-learning optimisations. We will</text><text x="439" y="763" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">publish it after the Grand Final.</text>
