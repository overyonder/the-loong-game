<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 556" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">How the capped replay store chooses what to retain</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="520" height="556" fill="#ede5d5"/>
<rect x="20" y="20" width="480" height="108" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="23" fill="#ede5d5" text-anchor="start" font-weight="bold">Select indexed games</text><text x="34" y="80" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">Our games → top teams → pins</text><text x="34" y="106" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">Then recent teams rated above us</text>
<rect x="20" y="156" width="480" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="181" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">One manifest</text><text x="34" y="216" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Highest qualifying priority wins</text><text x="34" y="242" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Keep identifiers, pins and file sizes</text>
<path d="M260 128 L260 154" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="292" width="480" height="108" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="317" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Make room under the cap</text><text x="34" y="352" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Remove unselected files first</text><text x="34" y="378" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Then lower-priority, older files</text>
<path d="M260 264 L260 290" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="428" width="480" height="108" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="34" y="453" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">Keep the useful files</text><text x="34" y="488" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Default storage cap: 100 GB</text><text x="34" y="514" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">The index survives file eviction</text>
<path d="M260 400 L260 426" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
