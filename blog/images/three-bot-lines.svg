<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 266" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The textbook, foil and learned bot lines</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1020" height="266" fill="#ede5d5"/>
<text x="20" y="30" font-size="17" fill="#20251f" text-anchor="start" font-weight="bold">Three lines answer different questions</text>
<rect x="20" y="54" width="310" height="150" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="79" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Textbook</text><text x="34" y="100" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">known methods, assembled clearly</text><text x="34" y="118" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">each departure is a candidate</text><text x="34" y="136" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">for the next improvement</text>
<rect x="355" y="54" width="310" height="150" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="369" y="79" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Foil</text><text x="369" y="100" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">a rival free to use any method</text><text x="369" y="118" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">a benchmark and counterpoint</text><text x="369" y="136" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">to the textbook line</text>
<rect x="690" y="54" width="310" height="150" rx="8" fill="#f6f1e7" stroke="#a8801a" stroke-width="1.6"/><text x="704" y="79" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Learned</text><text x="704" y="100" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">a policy learned from games</text><text x="704" y="118" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">teacher distilled into a student</text><text x="704" y="136" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">small enough for the judge</text>
<text x="20" y="242" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">They share the game, the evaluation pool and the evidence from replays. Their implementations stay separate.</text>
</svg>
