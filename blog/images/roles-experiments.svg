<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Each change against the first bot</title>
<desc id="d">Roles, first try: 46 wins, 72 losses, worse; No kamikazes: 49 wins, 68 losses, worse; No kamikazes, narrower champion berth: 58 wins, 58 losses, undecided; Narrower champion berth: 55 wins, 58 losses, undecided; Champion splits at length 10: 91 wins, 29 losses, better; Splits, but children work instead: 86 wins, 31 losses, better; Splits, and ignores its own echo: 90 wins, 30 losses, better.</desc>
<rect width="720" height="408" fill="#ede5d5"/>
<line x1="290" x2="290" y1="32" y2="374" stroke="#d9d0bf"/>
