<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 595" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The seven assigned roles of the historical planning bot</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="760" height="595" fill="#ede5d5"/>
<text x="20" y="30" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Roles in textbook-main-0026 · original rules</text>
<rect x="20" y="52" width="350" height="115" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="77" font-size="21" fill="#ede5d5" text-anchor="start" font-weight="bold">Champion</text><text x="34" y="112" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">grow and survive</text><text x="34" y="134" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">the longest-body finish</text>
<rect x="390" y="52" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="404" y="77" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Understudy</text><text x="404" y="112" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">grow elsewhere</text><text x="404" y="134" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">late-game second body</text>
<rect x="20" y="187" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="212" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Vanguard</text><text x="34" y="247" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">watch near the head</text><text x="34" y="269" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">guard and report ground</text>
<rect x="390" y="187" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="404" y="212" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Rearguard</text><text x="404" y="247" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">follow the tail</text><text x="404" y="269" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">report what lies behind</text>
<rect x="20" y="322" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="347" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Assassin</text><text x="34" y="382" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">stalk the enemy champion</text><text x="34" y="404" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">save the trade for it</text>
<rect x="390" y="322" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="404" y="347" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Scouts</text><text x="404" y="382" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">reveal unknown sectors</text><text x="404" y="404" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">risk shorter bodies</text>
<rect x="20" y="457" width="350" height="115" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="482" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Harvesters</text><text x="34" y="517" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">collect food and expand</text><text x="34" y="539" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">everyone else</text>
<text x="390" y="512" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">Roles change as team needs</text>
<text x="390" y="540" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">and each dragon&#x27;s picture change.</text>
</svg>
