<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The quantised student network inside the submitted bot</title>
<defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263d31"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker><marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="820" height="330" fill="#ede5d5"/>
<text x="40" y="40" font-size="20" font-weight="bold" fill="#20251f" text-anchor="start">What fits inside the submitted bot</text>
<text x="40" y="64" font-size="13" font-weight="normal" fill="#66675e" text-anchor="start">The student keeps the teacher's decisions while replacing its expensive trunk.</text>
<rect x="40" y="104" width="166" height="112" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><text x="54" y="129" font-size="15" font-weight="bold" fill="#20251f" text-anchor="start">Observation</text><text x="54" y="150" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">15 x 15 remembered crop</text><text x="54" y="168" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">whole-map overview</text><text x="54" y="186" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">scalars and sonar inbox</text>
<rect x="246" y="88" width="166" height="144" rx="8" fill="#2f7f79" stroke="#2f7f79" stroke-width="1.5"/><text x="260" y="113" font-size="15" font-weight="bold" fill="#ede5d5" text-anchor="start">Spatial features</text><text x="260" y="134" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">four integer convolutions</text><text x="260" y="152" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">one of four expert pairs</text><text x="260" y="170" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">13 n-tuple tables</text><text x="260" y="188" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">8-bit weights</text>
<rect x="452" y="88" width="166" height="144" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.5"/><text x="466" y="113" font-size="15" font-weight="bold" fill="#20251f" text-anchor="start">Memory and heads</text><text x="466" y="134" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">256-unit GRU</text><text x="466" y="152" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">committed role and claim</text><text x="466" y="170" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">move, split and sprint</text><text x="466" y="188" font-size="12.5" font-weight="normal" fill="#66675e" text-anchor="start">value and length diagnostics</text>
<rect x="658" y="104" width="122" height="112" rx="8" fill="#263d31" stroke="#263d31" stroke-width="1.5"/><text x="672" y="129" font-size="15" font-weight="bold" fill="#ede5d5" text-anchor="start">Reply</text><text x="672" y="150" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">most probable</text><text x="672" y="168" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">legal action</text><text x="672" y="186" font-size="12.5" font-weight="normal" fill="#ede5d5" text-anchor="start">status sonar</text>
<path d="M208 160 L242 160" fill="none" stroke="#263d31" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flow)"/>
<path d="M414 160 L448 160" fill="none" stroke="#263d31" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flow)"/>
<path d="M620 160 L654 160" fill="none" stroke="#263d31" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flow)"/>
<text x="40" y="278" font-size="13" font-weight="normal" fill="#66675e" text-anchor="start">Export replays the same turns through PyTorch's integer step and the WASM bot. Their</text>
<text x="40" y="296" font-size="13" font-weight="normal" fill="#66675e" text-anchor="start">observations, remembered maps and actions must agree on every turn before a student can be released.</text>
</svg>
