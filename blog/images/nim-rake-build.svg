<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 252" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">How a Nim bot reaches the judge</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="252" fill="#ede5d5"/>
<rect x="20" y="20" width="220" height="96" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">strategy.nim</text><text x="34" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">the strategy, in Nim</text><text x="34" y="84" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">changed constantly</text>
<rect x="20" y="136" width="220" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="161" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">kernels.rk</text><text x="34" y="182" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">hot kernels, in Rake</text><text x="34" y="200" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">rakec emits C for the judge</text>
<path d="M240 68 L300 68" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="300" y="20" width="220" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="314" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">nim c</text><text x="314" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">compileOnly, wasm32</text><text x="314" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">writes C into gen/</text>
<path d="M520 68 L560 68 L560 110 L590 110" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M240 184 L560 184 L560 140 L590 140" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="590" y="76" width="200" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="604" y="101" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">The judge&#x27;s clang</text><text x="604" y="122" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">compiles every .c file</text><text x="604" y="140" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">to WebAssembly</text>
<path d="M790 124 L830 124" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="830" y="76" width="160" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="844" y="101" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">bot.wasm</text><text x="844" y="122" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">metered, run per</text><text x="844" y="140" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">dragon, per turn</text>
</svg>
