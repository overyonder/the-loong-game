<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 328" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Decisions come back by rerunning the build that played</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="328" fill="#ede5d5"/>
<text x="20" y="30" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">In play</text>
<rect x="20" y="44" width="230" height="96" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="69" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">bot.wasm</text><text x="34" y="90" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">diagnostics compiled in,</text><text x="34" y="108" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">switched off: one flag check</text><text x="34" y="126" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">per block</text>
<path d="M250 92 L298 92" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="300" y="44" width="230" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="314" y="69" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">The judge</text><text x="314" y="90" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">plays the game</text><text x="314" y="108" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and writes the replay</text>
<path d="M530 92 L578 92" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="580" y="44" width="410" height="96" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="594" y="69" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">The replay</text><text x="594" y="90" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">what each dragon observed, turn by turn,</text><text x="594" y="108" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and what it did</text>
<text x="20" y="184" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">In the viewer</text>
<rect x="20" y="198" width="230" height="110" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="223" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">The same bot.wasm</text><text x="34" y="244" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">from the build registry,</text><text x="34" y="262" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">started with LOONG_INSPECT,</text><text x="34" y="280" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">so its diagnostics run</text>
<path d="M785 140 L785 170 L415 170 L415 196" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M250 253 L298 253" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="300" y="198" width="230" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="314" y="223" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">loong-recover</text><text x="314" y="244" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">runs it in the judge on each</text><text x="314" y="262" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">dragon&#x27;s recorded observations</text><text x="314" y="280" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and checks each action</text>
<path d="M530 253 L578 253" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="580" y="198" width="410" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="594" y="223" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">The viewer</text><text x="594" y="244" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">draws each turn&#x27;s records beside the board</text><text x="594" y="262" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and hides a dragon&#x27;s overlays after its</text><text x="594" y="280" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">rebuilt action first differs from the replay</text>
</svg>
