<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 232" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The games a verdict plays</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="232" fill="#ede5d5"/>
<rect x="20" y="20" width="300" height="80" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">The candidate plays…</text><text x="34" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">on every map, side and seed</text>
<rect x="20" y="120" width="300" height="80" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="145" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">…and so does the baseline</text><text x="34" y="166" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">in the candidate&#x27;s seat</text>
<rect x="400" y="20" width="250" height="56" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="525.0" y="45" font-size="15" fill="#20251f" text-anchor="middle" font-weight="bold">the baseline itself</text>
<rect x="400" y="88" width="250" height="56" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="525.0" y="113" font-size="15" fill="#20251f" text-anchor="middle" font-weight="bold">starter-c</text>
<rect x="400" y="156" width="250" height="56" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="525.0" y="181" font-size="15" fill="#20251f" text-anchor="middle" font-weight="bold">starter-py</text>
<path d="M320 60 L398 48" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 60 L398 116" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 60 L398 184" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 160 L398 48" fill="none" stroke="#66675e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 160 L398 116" fill="none" stroke="#66675e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 160 L398 184" fill="none" stroke="#66675e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="720" y="20" width="270" height="90" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="734" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Head to head</text><text x="734" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">paired game by game; judged</text><text x="734" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">by weighted sign flips</text>
<rect x="720" y="122" width="270" height="90" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="734" y="147" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Against weak bots</text><text x="734" y="168" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">a candidate that loses more of</text><text x="734" y="186" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">these is never called better</text>
<path d="M650 48 L718 64" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M650 116 L718 166" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M650 184 L718 166" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
