<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 558" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Nim with Rake kernels, or whole-program Rake, both emit C for the judge</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="520" height="558" fill="#ede5d5"/>
<text x="260" y="32" font-size="23" fill="#20251f" text-anchor="middle" font-weight="bold">Two routes to the same judge</text>
<rect x="20" y="58" width="480" height="108" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="83" font-size="23" fill="#ede5d5" text-anchor="start" font-weight="bold">Our current split</text><text x="34" y="118" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">Nim strategy + Rake kernels</text><text x="34" y="144" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">Each compiler emits C</text>
<rect x="20" y="200" width="480" height="134" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="225" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">A whole Rake program</text><text x="34" y="260" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">slow: setup, state and ordinary code</text><text x="34" y="286" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">run: traversals over racks</text><text x="34" y="312" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">crunch: lane-wise vector work</text>
<rect x="20" y="388" width="480" height="108" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="34" y="413" font-size="23" fill="#20251f" text-anchor="start" font-weight="bold">C and the starter API</text><text x="34" y="448" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">Link the chosen route with C helpers</text><text x="34" y="474" font-size="21" fill="#66675e" text-anchor="start" font-weight="normal">The judge&#x27;s clang makes bot.wasm</text>
<path d="M500 112 L510 112 L510 442 L502 442" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M260 334 L260 386" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="260" y="532" font-size="21" fill="#66675e" text-anchor="middle" font-weight="normal">Same protocol. Measure points separately.</text>
</svg>
