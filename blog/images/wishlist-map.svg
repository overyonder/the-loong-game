<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the wishlist tools fit together</title>
<desc id="d">A bot change goes through the evaluation harness, which plays on bundled and generated maps. Its results feed the offline Elo ladder and a statistical test of whether the change is better, which loops back to the next change. Public replays come in through the replay sampler, the replay decoder rebuilds them turn by turn, and the debug viewer shows what each dragon saw, for public games and our own. Profiling sits beside the bot.</desc>
