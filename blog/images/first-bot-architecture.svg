<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The first bot's structure</title>
<desc id="d">Each turn the dragon reads its 7 by 7 window. A state machine enters the first behaviour whose guard holds: Evade when an enemy head is within two tiles, otherwise Roam. Movement drops steps into kelp, bodies, portals and tiles next to an enemy head, then takes the remaining step the behaviour's objective scores highest.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="720" height="520" fill="#ede5d5"/>
<rect x="235" y="20" width="250" height="62" rx="7" fill="#f6f1e7" stroke="#3f6e8c" stroke-width="2.2"/>
<text x="360.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read the 7×7 window</text>
<text x="360.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">bodies, kelp, portals, enemy heads</text>
<path d="M360 82 L360 108" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="160" y="110" width="400" height="62" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="136" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">State machine</text>
<text x="360.0" y="158" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">enter the first behaviour whose guard holds</text>
<path d="M300 172 L180 218" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 172 L540 218" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="420" y="220" width="240" height="84" rx="7" fill="#7a4f8a" stroke="#7a4f8a" stroke-width="2.2"/>
<text x="540.0" y="246" font-size="16" fill="#ede5d5" text-anchor="middle" font-weight="bold">Evade</text>
<text x="540.0" y="268" font-size="12.5" fill="#f3ece0" text-anchor="middle" font-weight="normal">guard: enemy head within 2</text>
<text x="540.0" y="286" font-size="12.5" fill="#f3ece0" text-anchor="middle" font-weight="normal">objective: room + 4 × gap</text>
<rect x="60" y="220" width="240" height="84" rx="7" fill="#5d8a2e" stroke="#5d8a2e" stroke-width="2.2"/>
<text x="180.0" y="246" font-size="16" fill="#ede5d5" text-anchor="middle" font-weight="bold">Roam</text>
<text x="180.0" y="268" font-size="12.5" fill="#f3ece0" text-anchor="middle" font-weight="normal">guard: none</text>
<text x="180.0" y="286" font-size="12.5" fill="#f3ece0" text-anchor="middle" font-weight="normal">objective: room left</text>
<path d="M180 304 L300 336" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M540 304 L420 336" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="160" y="338" width="400" height="84" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="2.2"/>
<text x="360.0" y="364" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Movement: hard constraints first</text>
<text x="360.0" y="386" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">drop steps into kelp, bodies, portals</text>
<text x="360.0" y="404" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">and tiles next to an enemy head</text>
<path d="M360 422 L360 448" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="185" y="450" width="350" height="56" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="483.5" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Best remaining step by the objective</text>
</svg>
