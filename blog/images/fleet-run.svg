<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 272" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The fleet: standing resources and one run&#x27;s pieces</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="272" fill="#ede5d5"/>
<text x="20" y="30" font-size="14" fill="#20251f" text-anchor="start" font-weight="bold">Standing resources, declared in OpenTofu</text>
<text x="540" y="30" font-size="14" fill="#20251f" text-anchor="start" font-weight="bold">Made for each run by the launcher, then gone</text>
<rect x="20" y="44" width="230" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="69" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Buckets</text><text x="34" y="90" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">run bundles and results,</text><text x="34" y="108" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">expired after 14 days,</text><text x="34" y="126" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">public access blocked</text>
<rect x="270" y="44" width="230" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="284" y="69" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Fleet user</text><text x="284" y="90" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">launches, tags and</text><text x="284" y="108" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">terminates tagged Spot</text><text x="284" y="126" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">workers, runs queues</text>
<rect x="20" y="150" width="480" height="76" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="175" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Worker role</text><text x="34" y="196" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">read the run&#x27;s bundle, write results, lease jobs from its queue</text>
<rect x="540" y="44" width="200" height="92" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="554" y="69" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Launcher</text><text x="554" y="90" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">packs workers into the</text><text x="554" y="108" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">vCPU allowance, checks</text><text x="554" y="126" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">quota and the $50 ledger</text>
<rect x="780" y="44" width="210" height="92" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="794" y="69" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">One queue per run</text><text x="794" y="90" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">one message per game,</text><text x="794" y="108" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">leased and acknowledged</text>
<rect x="540" y="150" width="450" height="76" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="554" y="175" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Spot workers in Hyderabad and Mumbai</text><text x="554" y="196" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">pull games as cores free up, upload each result, shut down at the deadline</text>
<path d="M740 90 L778 90" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M885 136 L885 148" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M640 136 L640 148" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M500 188 L538 188" fill="none" stroke="#66675e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="20" y="256" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">A reaper on a system timer, outside every agent, terminates any worker past its deadline and costs runs whose launcher died.</text>
</svg>
