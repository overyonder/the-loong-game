<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A role gates task choice; interrupts preempt reactive phases</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="760" height="560" fill="#ede5d5"/>
<text x="20" y="30" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Historical task selection and reactive execution</text>
<rect x="20" y="55" width="340" height="125" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="80" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">The role permits behaviours</text><text x="34" y="115" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">targets and eligibility</text><text x="34" y="137" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">each behaviour&#x27;s own score</text>
<rect x="400" y="55" width="340" height="125" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="80" font-size="21" fill="#ede5d5" text-anchor="start" font-weight="bold">Choose a pair</text><text x="414" y="115" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">role weight × score</text><text x="414" y="137" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">switching margin: 2</text>
<path d="M360 117 L398 117" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M570 180 L570 202 L190 202 L190 223" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="225" width="340" height="155" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="250" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Interrupts, first refusal</text><text x="34" y="285" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">1  Give way</text><text x="34" y="307" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">2  Rescue split</text><text x="34" y="329" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">3  Evade</text>
<rect x="400" y="225" width="340" height="155" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="250" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Then the task&#x27;s phases</text><text x="414" y="285" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">coil: escape, leave,</text><text x="414" y="307" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">follow, approach</text><text x="414" y="329" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">first eligible child that acts</text>
<path d="M360 300 L398 300" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="370" y="284" font-size="15" fill="#66675e" text-anchor="middle" font-weight="normal">none</text>
<path d="M570 380 L570 423" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="400" y="425" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="450" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">An action</text><text x="414" y="485" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">or try the next task candidate</text>
<text x="20" y="465" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">No explicit transition graph.</text>
<text x="20" y="495" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">Order is rechecked each turn.</text>
</svg>
