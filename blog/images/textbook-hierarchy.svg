<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 692" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The textbook bot&#x27;s roles, tasks, states and movement</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="520" height="692" fill="#ede5d5"/>
<rect x="20" y="20" width="480" height="108" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="23" fill="#ede5d5" text-anchor="start" font-weight="bold">Observed world and sonar</text><text x="34" y="80" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">Local beliefs, no central controller</text><text x="34" y="106" font-size="21" fill="#d9d2c3" text-anchor="start" font-weight="normal">What does this dragon know?</text>
