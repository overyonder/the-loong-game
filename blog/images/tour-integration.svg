<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 755" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">What the historical student-mover experiment connected, and what it did not</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="760" height="755" fill="#ede5d5"/>
<text x="20" y="30" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Two different builds · the experiment is not the flagship</text>
<rect x="20" y="55" width="340" height="125" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="80" font-size="21" fill="#ede5d5" text-anchor="start" font-weight="bold">Frozen planning bot</text><text x="34" y="115" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">textbook-main-0026</text><text x="34" y="137" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">student hook unset</text>
<rect x="400" y="55" width="340" height="125" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="80" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Student-mover test</text><text x="414" y="115" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">textbook-test-0091</text><text x="414" y="137" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">student hook enabled</text>
<path d="M190 180 L190 213" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M570 180 L570 213" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="215" width="340" height="125" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="240" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Classical task and phases</text><text x="34" y="275" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">call the movement planner</text><text x="34" y="297" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">safety classes → utility</text>
<rect x="400" y="215" width="340" height="155" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="240" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Student runs first</text><text x="414" y="261" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">own encoding and memory</text><text x="414" y="284" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">no planning sonar or task input</text><text x="414" y="307" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">reserve 40M points</text>
<path d="M190 340 L190 423" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M570 370 L570 423" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="425" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="450" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Planner&#x27;s move or sprint</text><text x="34" y="485" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">splits and deaths from tasks</text>
<rect x="400" y="425" width="340" height="135" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="450" font-size="18" fill="#20251f" text-anchor="start" font-weight="bold">Substitute student movement</text><text x="414" y="471" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">no classical safety ranking</text><text x="414" y="494" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">tasks still own splits / deaths</text>
<rect x="20" y="610" width="720" height="120" rx="8" fill="none" stroke="#66675e" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="35" y="641" font-size="22" fill="#20251f" text-anchor="start" font-weight="bold">Unfinished: a cooperating hybrid</text>
<text x="35" y="675" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">Task-conditioned learning or learned evaluation inside search.</text>
<text x="35" y="705" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">Neither was used by the frozen flagship.</text>
</svg>
