<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 170" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The requests behind one replay</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="170" fill="#ede5d5"/>
<rect x="20" y="20" width="220" height="100" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Battles page</text><text x="34" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">/battles?sort=at&amp;dir=desc</text><text x="34" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">25 series a page,</text><text x="34" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">newest first</text>
<rect x="290" y="20" width="220" height="100" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="304" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Series page</text><text x="304" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">one per series</text><text x="304" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">lists its games</text>
<rect x="560" y="20" width="220" height="100" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="574" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Replay API</text><text x="574" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">/api/matches/&lt;game&gt;/replay</text><text x="574" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">redirects to storage</text>
<rect x="830" y="20" width="160" height="100" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="844" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Replay file</text><text x="844" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">packed binary,</text><text x="844" y="84" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">gzipped</text>
<path d="M240 70 L288 70" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M510 70 L558 70" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M780 70 L828 70" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="20" y="150" font-size="13" fill="#66675e" text-anchor="start" font-weight="normal">One replay costs three requests, and the first two are shared by every game in a series. Every request waits its turn.</text>
</svg>
