<rect x="20" y="205" width="340" height="110" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="230" font-size="21" fill="#ede5d5" text-anchor="start" font-weight="bold">Choose a task</text><text x="34" y="265" font-size="18" fill="#d9d2c3" text-anchor="start" font-weight="normal">behaviour + target + score</text>
<rect x="20" y="355" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="380" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Reactive phases</text><text x="34" y="415" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">interrupts before the task</text>
<rect x="400" y="355" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="380" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Movement</text><text x="414" y="415" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">legal, safety, then utility</text>
<rect x="400" y="505" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="530" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Action or fallback</text><text x="414" y="565" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">move, sprint or split</text>
