<text x="280" y="657" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">heard at another dragon&#x27;s next turn</text>
<rect x="400" y="732" width="340" height="90" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="757" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Its own memory and belief</text><text x="414" y="778" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">no shared omniscient store</text>
