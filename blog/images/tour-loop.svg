<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 845" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">One turn through the frozen pre-Queen planning bot</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="760" height="845" fill="#ede5d5"/>
<text x="20" y="30" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Implemented flow · no student hook in the flagship</text>
<rect x="20" y="55" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="80" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Read the turn</text><text x="34" y="115" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">window, inbox, echoes</text>
<rect x="400" y="55" width="340" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="80" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Memory → belief</text><text x="414" y="115" font-size="18" fill="#66675e" text-anchor="start" font-weight="normal">facts → hidden-state estimates</text>
