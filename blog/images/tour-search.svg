<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 710" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Safety ranking and bounded searches in the historical movement layer</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="760" height="710" fill="#ede5d5"/>
<text x="20" y="30" font-size="20" fill="#20251f" text-anchor="start" font-weight="bold">Inside movement.chooseMove · original-rule model</text>
<rect x="20" y="55" width="720" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="80" font-size="22" fill="#20251f" text-anchor="start" font-weight="bold">1  Legal single steps</text><text x="34" y="115" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">known passable edges; bodies and claims</text>
<path d="M380 165 L380 198" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="200" width="720" height="110" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="225" font-size="22" fill="#ede5d5" text-anchor="start" font-weight="bold">2  Hard safety classes</text><text x="34" y="260" font-size="19" fill="#d9d2c3" text-anchor="start" font-weight="normal">exits, threats, cycles, room and survival</text>
<path d="M380 310 L380 343" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="345" width="720" height="110" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="370" font-size="22" fill="#20251f" text-anchor="start" font-weight="bold">3  Task utility within the best class</text><text x="34" y="405" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">target, food field, soft costs and sprint cost</text>
<rect x="20" y="500" width="340" height="135" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="525" font-size="19" fill="#20251f" text-anchor="start" font-weight="bold">Bounded survival and sprints</text><text x="34" y="546" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">depth ≤ 24; 512 expansions</text><text x="34" y="569" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">beam ≤ 64; up to 3 steps</text>
<rect x="400" y="500" width="340" height="135" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="414" y="525" font-size="21" fill="#20251f" text-anchor="start" font-weight="bold">Nearby head duel</text><text x="414" y="546" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">4 plies; 8,192 expansions</text><text x="414" y="569" font-size="17" fill="#66675e" text-anchor="start" font-weight="normal">whole opponent body visible</text>
<text x="20" y="678" font-size="19" fill="#66675e" text-anchor="start" font-weight="normal">Other bodies frozen; splits and deaths are not searched here.</text>
