<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 190" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">What a judge does</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1010" height="190" fill="#ede5d5"/>
<rect x="20" y="20" width="250" height="150" rx="8" fill="#263d31" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#ede5d5" text-anchor="start" font-weight="bold">Game engine</text><text x="34" y="66" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">unswbc_engine.wasm</text><text x="34" y="84" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">owns every rule</text><text x="34" y="102" font-size="12.5" fill="#d9d2c3" text-anchor="start" font-weight="normal">writes the replay</text>
<rect x="370" y="20" width="250" height="150" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="384" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">The judge</text><text x="384" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">hosts the engine</text><text x="384" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">feeds each dragon its turn</text><text x="384" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">meters CPU points</text><text x="384" y="120" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">reads the reply</text>
<rect x="720" y="20" width="270" height="70" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="734" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Dragon 0: bot.wasm</text><text x="734" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">its view on stdin, a reply on stdout</text>
<rect x="720" y="100" width="270" height="70" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="734" y="125" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">Dragon 1: bot.wasm</text><text x="734" y="146" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">…one instance per dragon</text>
<path d="M270 95 L368 95" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M368 110 L272 110" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M620 55 L718 55" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M620 135 L718 135" fill="none" stroke="#66675e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="320" y="135" font-size="11.5" fill="#66675e" text-anchor="middle" font-weight="normal">bot_spawn,</text>
<text x="320" y="150" font-size="11.5" fill="#66675e" text-anchor="middle" font-weight="normal">bot_reply, log</text>
</svg>
