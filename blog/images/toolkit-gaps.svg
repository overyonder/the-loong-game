<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 190" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">What the toolkit gives you, and what it doesn&#x27;t tell you</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b53b13"/></marker></defs>
<rect width="1020" height="190" fill="#ede5d5"/>
<rect x="20" y="20" width="470" height="150" rx="8" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.6"/><text x="34" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">What the toolkit gives you</text><text x="34" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">unswbc init: a starter bot in C, C++ or Python</text><text x="34" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">unswbc run --sandbox: a game, as the judge plays it</text><text x="34" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">--seed: the same game again, exactly</text><text x="34" y="120" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">unswbc submit: an upload to the ladder</text><text x="34" y="138" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">the website: docs, a replay visualiser,</text><text x="34" y="156" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">and every public ladder game</text>
<rect x="530" y="20" width="470" height="150" rx="8" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.6"/><text x="544" y="45" font-size="15" fill="#20251f" text-anchor="start" font-weight="bold">What it doesn&#x27;t tell you</text><text x="544" y="66" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">whether a change made the bot better</text><text x="544" y="84" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">why a dragon died, and what it could see</text><text x="544" y="102" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">how other teams&#x27; bots actually play</text><text x="544" y="120" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">where the CPU budget went</text><text x="544" y="138" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal"></text><text x="544" y="156" font-size="12.5" fill="#66675e" text-anchor="start" font-weight="normal">These are what the tools posts build.</text>
</svg>
