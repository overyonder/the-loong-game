<rect x="31.400000000000006" y="246" width="51" height="22" rx="11" fill="#7a4f8a"/><text x="56.900000000000006" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Evade</text>
<rect x="88.4" y="246" width="44" height="22" rx="11" fill="#4f5d99"/><text x="110.2" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Coil</text>
<rect x="138.0" y="246" width="44" height="22" rx="11" fill="#5d8a2e"/><text x="159.8" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Roam</text>
<rect x="187.6" y="246" width="51" height="22" rx="11" fill="#6f6a5f"/><text x="213.1" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Split</text>
