<text x="240" y="305" font-size="12" fill="#66675e" text-anchor="start" font-weight="normal">a feeder's sacrifice, switched off: it made the bot worse</text>
<path d="M360 314 L360 330" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="170" y="332" width="380" height="80" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="2.2"/>
<text x="360.0" y="358" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Safety layer</text>
<text x="360.0" y="380" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">no kelp, bodies or unseen portals; a hunting</text>
<text x="360.0" y="398" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">kamikaze alone may step next to an enemy head</text>
<path d="M360 412 L360 438" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="200" y="440" width="320" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="466" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Score moves</text>
<text x="360.0" y="488" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">with the chosen mode's behaviour</text>
<path d="M300 498 L200 524" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 498 L520 524" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="60" y="526" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="200.0" y="552" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Move, or split</text>
<text x="200.0" y="574" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">the best move, or a champion's split</text>
<rect x="380" y="526" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="520.0" y="552" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Announce</text>
<text x="520.0" y="574" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">team tag, ID, role, length and position</text>
