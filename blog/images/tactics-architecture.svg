<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 598" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The tactics bot's structure</title>
<desc id="d">The roles bot's structure with new behaviours. The champion splits, evades, coils when no enemy head is within three tiles, or roams. A feeder evades, delivers itself to the champion once grown, or forages. A kamikaze hunts or roams. Sonar messages now carry each dragon's head position.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="720" height="598" fill="#ede5d5"/>
<rect x="40" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="180.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Listen</text>
<text x="180.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">longest teammate and where it is</text>
<rect x="400" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#3f6e8c" stroke-width="2.2"/>
<text x="540.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read the 7×7 window</text>
<text x="540.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">bodies, pearls, the champion's body</text>
<path d="M180 78 L300 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M540 78 L420 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="200" y="108" width="320" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="134" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">State machine: a role</text>
<text x="360.0" y="156" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">from length and the longest heard</text>
<path d="M300 166 L130 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M360 166 L360 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 166 L590 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="10" y="206" width="280" height="74" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="150.0" y="231" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Champion</text>
<rect x="46.400000000000006" y="246" width="51" height="22" rx="11" fill="#6f6a5f"/><text x="71.9" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Split</text>
<rect x="103.4" y="246" width="51" height="22" rx="11" fill="#7a4f8a"/><text x="128.9" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Evade</text>
<rect x="160.4" y="246" width="44" height="22" rx="11" fill="#4f5d99"/><text x="182.20000000000002" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Coil</text>
<rect x="210.0" y="246" width="44" height="22" rx="11" fill="#5d8a2e"/><text x="231.8" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Roam</text>
<rect x="300" y="206" width="170" height="74" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="385.0" y="231" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Kamikaze</text>
<rect x="338.4" y="246" width="44" height="22" rx="11" fill="#a23b5f"/><text x="360.2" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Hunt</text>
<rect x="388.0" y="246" width="44" height="22" rx="11" fill="#5d8a2e"/><text x="409.8" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Roam</text>
<rect x="480" y="206" width="230" height="74" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="595.0" y="231" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Feeder</text>
<rect x="501.4" y="246" width="51" height="22" rx="11" fill="#7a4f8a"/><text x="526.9" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Evade</text>
<rect x="558.4" y="246" width="66" height="22" rx="11" fill="#9c5b2e"/><text x="591.3" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Deliver</text>
<rect x="630.2" y="246" width="58" height="22" rx="11" fill="#8f8a25"/><text x="659.4000000000001" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Forage</text>
<text x="360" y="302" font-size="12" fill="#66675e" text-anchor="middle" font-weight="normal">then the first behaviour whose guard holds; Split, Hunt's strike and Deliver's sacrifice act as reflexes</text>
<path d="M360 310 L360 330" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="170" y="332" width="380" height="80" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="2.2"/>
<text x="360.0" y="358" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Movement: hard constraints first</text>
<text x="360.0" y="380" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">no kelp, bodies or unseen portals; only Hunt</text>
<text x="360.0" y="398" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">may step next to an enemy head</text>
<path d="M360 412 L360 438" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="185" y="440" width="350" height="56" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="473.5" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Best remaining step by the objective</text>
<path d="M300 496 L200 522" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 496 L520 522" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="60" y="524" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="200.0" y="550" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Move, or split</text>
<text x="200.0" y="572" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">the step, or a champion's split</text>
<rect x="380" y="524" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="520.0" y="550" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Announce</text>
<text x="520.0" y="572" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">team tag, ID, role, length and position</text>
</svg>
