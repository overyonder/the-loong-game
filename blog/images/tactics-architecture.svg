<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The tactics bot's structure</title>
<desc id="d">The roles bot's structure with new behaviours. The champion evades, coils when nothing threatens it, roams and splits. A feeder evades or forages, with its Deliver mode switched off because it made the bot worse. A kamikaze roams or hunts. Sonar messages now carry each dragon's head position.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="720" height="600" fill="#ede5d5"/>
<rect x="40" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="180.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read sonar</text>
<text x="180.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">longest teammate and where it is</text>
<rect x="400" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#3f6e8c" stroke-width="2.2"/>
<text x="540.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read the 7×7 window</text>
<text x="540.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">bodies, pearls, the champion's body</text>
