<rect x="170" y="308" width="380" height="80" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="2.2"/>
<text x="360.0" y="334" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Safety layer</text>
<text x="360.0" y="356" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">no kelp, bodies or unseen portals; a hunting</text>
<text x="360.0" y="374" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">kamikaze alone may step next to an enemy head</text>
<path d="M360 388 L360 414" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="200" y="416" width="320" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="442" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Score moves</text>
<text x="360.0" y="464" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">with the chosen mode's behaviour</text>
<path d="M300 474 L200 500" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 474 L520 500" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="60" y="502" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="200.0" y="528" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Move, or split</text>
<text x="200.0" y="550" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">the best move, or a champion's split</text>
<rect x="380" y="502" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="520.0" y="528" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Announce</text>
<text x="520.0" y="550" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">team tag, ID, role and length</text>
</svg>
