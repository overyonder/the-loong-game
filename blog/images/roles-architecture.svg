<rect x="51.2" y="246" width="44" height="22" rx="11" fill="#5d8a2e"/><text x="73.0" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Roam</text>
<rect x="100.80000000000001" y="246" width="51" height="22" rx="11" fill="#7a4f8a"/><text x="126.30000000000001" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Evade</text>
<rect x="157.8" y="246" width="51" height="22" rx="11" fill="#6f6a5f"/><text x="183.3" y="261.5" font-size="12" fill="#ede5d5" text-anchor="middle" font-weight="bold">Split</text>
<rect x="250" y="206" width="220" height="74" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="231" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Worker</text>
