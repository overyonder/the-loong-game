<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The roles bot's structure</title>
<desc id="d">Each turn the dragon reads its sonar and its window. It picks a role, which limits the modes it may use: the champion roams, evades and splits off kamikazes, a worker roams or evades, and a kamikaze roams or hunts. The safety layer then removes deadly moves, except that a hunting kamikaze may step next to an enemy head. The chosen mode scores the rest, the best move is sent, and the dragon announces its role and length on sonar.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="720" height="560" fill="#ede5d5"/>
<rect x="40" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.2"/>
<text x="180.0" y="44" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Read sonar</text>
<text x="180.0" y="64" font-size="12" fill="#66675e" text-anchor="middle">longest teammate heard</text>
<rect x="400" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.2"/>
<text x="540.0" y="44" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Read the 7×7 window</text>
<text x="540.0" y="64" font-size="12" fill="#66675e" text-anchor="middle">bodies, kelp, portals, enemy heads</text>
<path d="M180 78 L300 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M540 78 L420 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="230" y="108" width="260" height="58" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.8"/>
<text x="360.0" y="132" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Pick a role</text>
<text x="360.0" y="152" font-size="12" fill="#66675e" text-anchor="middle">champion, worker or kamikaze</text>
<path d="M360 166 L130 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="30" y="206" width="200" height="62" rx="7" fill="#263d31" stroke="#263d31" stroke-width="1.2"/>
<text x="130.0" y="230" font-size="15" font-weight="bold" fill="#ede5d5" text-anchor="middle">Champion</text>
<text x="130.0" y="250" font-size="12" fill="#c7c1b2" text-anchor="middle">roam, evade, split</text>
<path d="M130 268 L360 306" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M360 166 L360 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="260" y="206" width="200" height="62" rx="7" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.2"/>
<text x="360.0" y="230" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Worker</text>
<text x="360.0" y="250" font-size="12" fill="#66675e" text-anchor="middle">roam, evade</text>
<path d="M360 268 L360 306" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M360 166 L590 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="490" y="206" width="200" height="62" rx="7" fill="#b53b13" stroke="#b53b13" stroke-width="1.2"/>
<text x="590.0" y="230" font-size="15" font-weight="bold" fill="#ede5d5" text-anchor="middle">Kamikaze</text>
<text x="590.0" y="250" font-size="12" fill="#f3d9cc" text-anchor="middle">roam, hunt</text>
<path d="M590 268 L360 306" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="170" y="308" width="380" height="64" rx="7" fill="#f6f1e7" stroke="#b53b13" stroke-width="1.8"/>
<text x="360.0" y="332" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Safety layer</text>
<text x="360.0" y="352" font-size="12" fill="#66675e" text-anchor="middle">no kelp, bodies or unseen portals; a hunting</text>
<text x="360.0" y="369" font-size="12" fill="#66675e" text-anchor="middle">kamikaze alone may step next to an enemy head</text>
<path d="M360 372 L360 398" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="230" y="400" width="260" height="54" rx="7" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.2"/>
<text x="360.0" y="424" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Score moves in the mode</text>
<path d="M360 454 L360 480" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="170" y="482" width="380" height="62" rx="7" fill="#f6f1e7" stroke="#b9ad99" stroke-width="1.2"/>
<text x="360.0" y="506" font-size="15" font-weight="bold" fill="#20251f" text-anchor="middle">Move, then announce</text>
<text x="360.0" y="526" font-size="12" fill="#66675e" text-anchor="middle">sonar: team tag, role and length, all four ways</text>
</svg>
