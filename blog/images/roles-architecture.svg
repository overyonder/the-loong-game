<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 576" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The roles bot's structure</title>
<desc id="d">Each turn the dragon reads its sonar and its window, then picks a role. The role limits its modes: the champion roams, evades and splits off kamikazes, a worker roams or evades, and a kamikaze roams or hunts. The safety layer removes deadly moves, the chosen mode's behaviour scores the rest, the best move is sent or the champion splits, and the dragon announces itself on sonar.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66675e"/></marker></defs>
<rect width="720" height="576" fill="#ede5d5"/>
<rect x="40" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#2f7f79" stroke-width="2.2"/>
<text x="180.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read sonar</text>
<text x="180.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">longest teammate heard</text>
<rect x="400" y="20" width="280" height="58" rx="7" fill="#f6f1e7" stroke="#3f6e8c" stroke-width="2.2"/>
<text x="540.0" y="46" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Read the 7×7 window</text>
<text x="540.0" y="68" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">bodies, kelp, portals, enemy heads</text>
<path d="M180 78 L300 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M540 78 L420 106" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="230" y="108" width="260" height="58" rx="7" fill="#f6f1e7" stroke="#a8801a" stroke-width="2.2"/>
<text x="360.0" y="134" font-size="16" fill="#20251f" text-anchor="middle" font-weight="bold">Pick a role</text>
<text x="360.0" y="156" font-size="12.5" fill="#66675e" text-anchor="middle" font-weight="normal">from length and the longest heard</text>
<path d="M300 166 L130 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M360 166 L360 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M420 166 L590 204" stroke="#66675e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
